# Deploy on a Swarm manager:  docker stack deploy -c docker-stack.yml swarmdash
#
# Variablen (optional, werden von `docker stack deploy` aus der Umgebung ersetzt):
#   SWARMDASH_IMAGE  Image fuer Dashboard UND Agent   (Standard: swarm-dashboard:latest)
#   SWARMDASH_PORT   veroeffentlichter Port           (Standard: 3000)
# Beispiel Registry:  SWARMDASH_IMAGE=registry.example.com/swarm-dashboard:latest \
#                     docker stack deploy --with-registry-auth -c docker-stack.yml swarmdash
version: "3.8"

services:
  dashboard:
    image: ${SWARMDASH_IMAGE:-swarm-dashboard:latest}
    ports:
      - "${SWARMDASH_PORT:-3000}:3000"
    volumes:
      # Mount the manager's Docker socket so the app can talk to the Swarm API.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist settings + backup history.
      - swarmdash_data:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Helper containers (volume copy/size/export) reuse this image - it is present on every node.
      - HELPER_IMAGE=${SWARMDASH_IMAGE:-swarm-dashboard:latest}
      # Node-agent discovery (matches the agent's network alias below).
      - AGENT_SERVICE=swarmdash-agent
      - AGENT_PORT=9787
    networks:
      - swarmdash
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

  # Global node agent — one per node — reports real host CPU/RAM/disk.
  agent:
    image: ${SWARMDASH_IMAGE:-swarm-dashboard:latest}
    command: ["node", "server/src/agent.js"]
    environment:
      - AGENT_PORT=9787
      - HOST_ROOT=/host
      - HELPER_IMAGE=${SWARMDASH_IMAGE:-swarm-dashboard:latest}
      - NODE_ID={{.Node.ID}}
      - NODE_HOSTNAME={{.Node.Hostname}}
    volumes:
      # Read-only host root so the agent can read /proc and stat the host FS.
      - /:/host:ro
      # Local Docker socket — required to broker console (exec) and export (commit)
      # for containers on this node. Grants root-equivalent access on the node.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      swarmdash:
        aliases:
          - swarmdash-agent
    deploy:
      mode: global
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

networks:
  swarmdash:
    driver: overlay
    attachable: true

volumes:
  swarmdash_data:
